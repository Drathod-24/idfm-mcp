[project]
name = "idfm-mcp"
version = "0.1.0"
description = "MCP server for Île-de-France Mobilités (Paris public transport), built on the IDFM PRIM API"
readme = "README.md"
authors = [
    { name = "Drathod-24", email = "dhruvilsinhrathod24@gmail.com" }
]
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "tzdata>=2026.6",
]

[project.scripts]
idfm-mcp = "idfm_mcp.server:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "respx>=0.23.1",
    "ruff>=0.17.3",
]
evals = [
    "anthropic>=2.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: hits the real PRIM API (needs IDFM_API_KEY)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
